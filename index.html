<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ant-bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside id="chat-list" class="panel">
            <div class="chat-list-header">
                <div class="header-title-row">
                    <h1 class="title">Диалоги</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span class="status-text">Обновлено</span>
                    </div>
                    <button id="refresh-btn" class="refresh-btn" title="Обновить">↻</button>
                </div>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Поиск">
            </div>

            <div class="archive-item" id="archive-btn">
                <div class="archive-icon">🗄</div>
                <span class="archive-text">Архив</span>
                <span class="archive-arrow">›</span>
            </div>

            <div id="chats" class="chats"></div>
        </aside>

        <main id="chat-view" class="panel">
            <div id="chat-header" class="chat-header">
                <button id="back-btn" class="icon-btn">←</button>
                <span id="chat-title" class="chat-title">ant-bot</span>
                <button id="menu-btn" class="icon-btn">⋮</button>
                <div id="dropdown" class="dropdown hidden">
                    <div class="dropdown-item" data-fmt="html">Экспорт HTML</div>
                    <div class="dropdown-item" data-fmt="json">Экспорт JSON</div>
                    <div class="dropdown-item" data-fmt="txt">Экспорт TXT</div>
                </div>
            </div>
            <div id="messages" class="messages">
                <div class="placeholder">Выберите чат</div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
